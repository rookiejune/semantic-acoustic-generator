# @package _global_
defaults:
  - override /backend: longcat
  - override /datamodule: qwen_cross_text
  - override /model: default
  - override /model/route: fm
  - override /loss: default
  - override /pl_module: default
  - override /runtime: default
  - override /callback: default
  - override /trainer: default
  - _self_

# One-epoch cross-text screening over source indices 0..983.
output_subdir: screening/${backend.name}/${model.route}-${model.decoder.layers}l

datamodule:
  sample_limit: 984
  # Hard duration filter; batch budget alone no longer truncates or drops samples.
  max_seconds: 32.0
  overlong: filter
  batching:
    # Additive semantic-frame packing budget for the filtered 980/984 pairs.
    max_batch_seconds: 32.0

trainer:
  max_steps: -1
  max_epochs: 1
  log_every_n_steps: 1

callback:
  sample:
    every_n_train_steps: 50
  performance:
    profile_flops: false
    log_every_n_steps: 10
    warmup_steps: 10
    measure_window_steps: 20
  checkpoint:
    every_n_train_steps: 50
