# @package _global_

# Fixed-sample contract check for the generator, not a production preset.
data:
  source: qwen_cross_text
  sample_index: 0
  sample_limit: 1
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  lba:
    enabled: false

optimizer:
  learning_rate: 1e-3
  weight_decay: 0.0

train:
  fixed_batch: true
  max_steps: 20

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  max_epochs: -1
  log_every_n_steps: 1
  enable_checkpointing: false
  gradient_clip_val: 1.0

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: 10
