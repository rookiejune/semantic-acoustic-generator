# @package _global_
defaults:
  - override /backend: longcat
  - override /datamodule: qwen_cross_text
  - override /model: default
  - override /model/route: fm
  - override /loss: default
  - override /pl_module: default
  - override /runtime: default
  - override /callback: default
  - override /trainer: default
  - _self_

output_subdir: smoke/${backend.name}/${model.route}

datamodule:
  sample_limit: 1
  max_seconds: 4.0
  overlong: truncate
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  batching:
    enabled: false

trainer:
  accelerator: auto
  devices: 1
  strategy: auto
  precision: 32-true
  max_steps: 2
  log_every_n_steps: 1

callback:
  checkpoint:
    enabled: false
    every_n_train_steps: 1
