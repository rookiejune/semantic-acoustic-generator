# @package _global_

data:
  sample_limit: 1
  max_seconds: 4.0
  overlong: truncate
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  lba:
    enabled: false

train:
  max_steps: 2

trainer:
  accelerator: auto
  devices: 1
  strategy: auto
  precision: 32-true
  log_every_n_steps: 1
  enable_checkpointing: false

checkpoint:
  every_n_train_steps: 1
