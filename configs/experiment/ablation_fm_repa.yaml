# @package _global_
defaults:
  - override /backend: longcat
  - override /datamodule: qwen_cross_text
  - override /model: default
  - override /model/route: fm
  - override /loss: default
  - override /pl_module: default
  - override /runtime: default
  - override /callback: default
  - override /trainer: default
  - _self_

# LongCat-FM REPA cell on the screening budget.
output_subdir: ablation/longcat-fm/repa

datamodule:
  sample_limit: 984
  max_seconds: 32.0
  overlong: filter
  batching:
    max_batch_seconds: 32.0

loss:
  repa_loss_weight: 0.25
  # WavLM-base hidden size; left explicit so configs stay readable without constructing the teacher.
  repa_feature_dim: 768

trainer:
  max_steps: -1
  max_epochs: 1
  log_every_n_steps: 1

callback:
  sample:
    every_n_train_steps: 50
  performance:
    profile_flops: true
    log_every_n_steps: 10
    warmup_steps: 10
    measure_window_steps: 20
  checkpoint:
    every_n_train_steps: 50
