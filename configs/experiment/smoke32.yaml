# @package _global_
defaults:
  - override /backend: longcat
  - override /datamodule: qwen_cross_text
  - override /model: default
  - override /model/route: fm
  - override /loss: default
  - override /pl_module: default
  - override /runtime: default
  - override /callback: default
  - override /trainer: default
  - _self_

# Representative 32-sample fixed-speaker smoke. This is intentionally small,
# but it exercises the real DataModule, checkpointing, resume, metrics, and
# sample audio logging paths.
output_subdir: smoke32/${backend.name}/${model.route}

datamodule:
  root: ${oc.env:DYNAMIC_HOME}/debug/semantic-acoustic-codec/qwen-fixed-speaker-codec-32
  split: train
  sample_index: 0
  sample_limit: 32
  max_seconds: 8.0
  overlong: truncate
  batch_size: 8
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  batching:
    enabled: false
  fixed_batch: false

pl_module:
  finite_loss_check_interval: 1

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  max_steps: 4
  max_epochs: -1
  log_every_n_steps: 1
  gradient_clip_val: 1.0

callback:
  performance:
    enabled: true
    profile_flops: true
    log_every_n_steps: 1
    warmup_steps: 0
    measure_window_steps: 2
  sample:
    enabled: true
    every_n_train_steps: 2
    seed: 0
  checkpoint:
    enabled: true
    save_last: true
    save_top_k: -1
    every_n_train_steps: 2
