debug:
  enabled: false
sample:
  enabled: true
  every_n_train_steps: 10000
  seed: 0
performance:
  # The generic timer synchronizes CUDA (and DDP ranks) every batch. Keep it
  # calibration-only; production throughput uses the event-based callback below.
  enabled: false
  # Short screening/ablation/smoke experiments explicitly enable FLOPs profiling.
  # Longruns can opt in with a calibrated model_flops_per_step.
  model_flops_per_step: null
  profile_flops: false
  hardware_peak_flops: null
  log_every_n_steps: 100
  warmup_steps: 20
  measure_window_steps: 100
data_throughput:
  enabled: true
  # null follows the Trainer logger cadence; otherwise the unit is semantic frames.
  log_every_n_units: null
  measure_window_batches: 100
  sync_cuda: true
  sync_distributed: true
codebook_usage:
  enabled: true
  every_n_steps: 100
loss_summary:
  enabled: true
  window_capacity: 20
observation:
  enabled: true
  every_n_steps: 100
  half_life_steps: 1000
  sync_distributed: false
checkpoint:
  enabled: true
  filename: step-{step:08d}
  save_last: true
  save_top_k: -1
  every_n_train_steps: 10000
ema:
  use_ema_weights: true
