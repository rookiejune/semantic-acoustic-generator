[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-acoustic-generator"
version = "0.1.0"
description = "Reference-optional semantic-to-acoustic generation for external codec backends."
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "anytrain"]

[project.optional-dependencies]
rvq = ["transformers>=4.50"]
train = ["lightning>=2.0", "hydra-core>=1.3", "anytrain[flow]", "anydataset"]
test = ["pytest>=8.0", "anydataset"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../workspace/src",
    "../third_party/anytrain/src",
    "../third_party/anydataset/src",
]

[tool.basedpyright]
include = ["src", "scripts"]
extraPaths = [
    "src",
    "../workspace/src",
    "../third_party/anytrain/src",
    "../third_party/anydataset/src",
]
pythonVersion = "3.9"
typeCheckingMode = "standard"
venvPath = "/Users/zhuyin/miniconda3/envs"
venv = "py312"
