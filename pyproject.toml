[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-acoustic-codec"
version = "0.1.0"
description = "Reference-optional semantic-to-acoustic codec generation."
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "anytrain", "anydataset"]

[project.optional-dependencies]
rvq = ["transformers>=4.50"]
train = ["lightning>=2.0", "hydra-core>=1.3", "lba>=2.0", "anytrain[flow]"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../workspace/src",
    "../third_party/anytrain/src",
    "../third_party/anydataset/src",
    "../third_party/length-based-batching-adapter/src",
]
